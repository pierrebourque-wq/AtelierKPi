<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaires AtelierKPi</title></head>
<body>
<!-- Fichier technique : permet à Netlify de détecter les formulaires. À téléverser avec index.html et catalogue.html. -->
<form name="demande" data-netlify="true" enctype="multipart/form-data" hidden>
<input type="text" name="nom"><input type="email" name="email"><input type="text" name="type">
<textarea name="description"></textarea><input type="text" name="subject">
<input type="file" name="fichier1"><input type="file" name="fichier2"><input type="file" name="fichier3">
</form>
<form name="commande" data-netlify="true" enctype="multipart/form-data" hidden>
<input type="text" name="subject"><input type="text" name="commande"><input type="text" name="nom">
<input type="email" name="email"><input type="text" name="telephone"><input type="text" name="quantite">
<input type="text" name="couleur"><input type="text" name="remise"><input type="text" name="adresse">
<textarea name="note"></textarea><input type="text" name="total">
<input type="file" name="fichier1"><input type="file" name="fichier2">
</form>
</body>
</html>
